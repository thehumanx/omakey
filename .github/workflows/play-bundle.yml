name: Play bundle
on:
  workflow_dispatch:
  push:
    branches: [thehumanx/cool-volta-nztc9a]
    paths: ['app/**', 'core/**', 'extensions-*/**', 'gradle/**', '*.kts', '.github/workflows/play-bundle.yml']

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      # Optional: if the UPLOAD_KEYSTORE_B64 secret exists the bundle is signed; otherwise it is
      # built unsigned (still proves the build compiles).
      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            mkdir -p keystore
            echo "$KS_B64" | base64 -d > keystore/release.jks
            printf 'storeFileName=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > keystore/keystore.properties
          fi
      - run: ./gradlew :core:test :app:bundlePlayRelease :app:assembleGithubRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: omakey-play-bundle
          path: |
            app/build/outputs/bundle/playRelease/*.aab
            app/build/outputs/apk/github/release/*.apk
